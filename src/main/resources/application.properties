spring.application.name=royaltyhouse

# Valores de ejemplo para PostgreSQL local.
spring.datasource.url=jdbc:postgresql://localhost:5432/royaltyhouse
spring.datasource.username=postgres
spring.datasource.password=PortgasD.Ace

# Inicializa el esquema y los datos desde schema.sql y data.sql.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Configuración de vistas y sesiones.
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m

# Reglas configurables de reservas.
royaltyhouse.reservas.horas-limite-cancelacion=2
royaltyhouse.reservas.maximo-activas-por-cliente=2
