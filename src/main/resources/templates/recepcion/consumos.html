<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Candy bar | Royalty House</title><link rel="stylesheet" th:href="@{/css/royalty-house.css}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main class="container"><h1>Consumir candy bar</h1><div th:if="${mensaje}" class="alert" th:text="${mensaje}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div>
<form method="get" class="card form-stack"><label>Código de reserva minicine<input name="codigo" th:value="${param.codigo}"></label><button type="submit">Buscar reserva</button></form>
<form th:if="${reserva}" th:action="@{/recepcion/consumos}" method="post" class="card form-stack"><input type="hidden" name="reservaId" th:value="${reserva.id}"><h2 th:text="${reserva.codigo}"></h2><div th:each="p:${productos}" class="form-row"><span th:text="${p.nombre}+' · '+${p.precio}+' · stock '+${p.existencias}"></span><input type="number" th:name="${'cantidad_'+p.id}" min="0" th:max="${p.existencias}" value="0"></div><button type="submit">Registrar consumos</button></form></main><div th:replace="~{fragments/layout :: footer}"></div></body></html>
