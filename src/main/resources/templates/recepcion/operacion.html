<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrada y salida | Royalty House</title><link rel="stylesheet" th:href="@{/css/royalty-house.css}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main class="container"><h1>Entrada y salida</h1><div th:if="${mensaje}" class="alert" th:text="${mensaje}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div>
<div class="card"><form method="get" class="form-stack"><label>Código<input name="codigo" th:value="${param.codigo}"></label><button type="submit">Buscar código</button></form><form method="get" class="form-stack"><label>Nombre del cliente<input name="nombre"></label><button type="submit">Buscar nombre</button></form></div>
<section th:if="${reserva}" class="card"><h2 th:text="${reserva.codigo}"></h2><p th:text="${reserva.nombreCliente}+' · '+${reserva.telefonoCliente}"></p><p>Estado: <strong th:text="${reserva.estado}"></strong></p><form method="post" th:action="@{/recepcion/operacion/entrada}" class="inline-form"><input type="hidden" name="codigo" th:value="${reserva.codigo}"><button type="submit">Registrar entrada</button></form><form method="post" th:action="@{/recepcion/operacion/salida}" class="inline-form"><input type="hidden" name="codigo" th:value="${reserva.codigo}"><button type="submit">Registrar salida</button></form><form method="post" th:action="@{/recepcion/operacion/no-presentada}" class="inline-form"><input type="hidden" name="codigo" th:value="${reserva.codigo}"><button class="danger" type="submit">Marcar no presentada</button></form></section>
<section th:if="${reservas}"><div th:each="r:${reservas}" class="reservation-card"><strong th:text="${r.codigo}"></strong> - <span th:text="${r.nombreCliente}"></span> - <span th:text="${r.estado}"></span></div></section></main><div th:replace="~{fragments/layout :: footer}"></div></body></html>
