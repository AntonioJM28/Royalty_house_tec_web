<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nueva reserva | Royalty House</title><link rel="stylesheet" th:href="@{/css/royalty-house.css}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main class="container narrow"><h1>Registrar reserva en mostrador</h1><div th:if="${error}" class="alert error" th:text="${error}"></div>
<form th:action="@{/recepcion/reserva/nueva}" method="post" class="card form-stack"><label>Cliente encontrado (opcional)<input name="usuarioId" type="number"></label><label>Nombre*<input name="nombre" required></label><label>Teléfono*<input name="telefono" required></label><label>Recurso<select name="recursoId" required><option th:each="r:${recursos}" th:value="${r.id}" th:text="${r.nombre}" th:selected="${recursoId==r.id}"></option></select></label><label>Película (solo minicine)<select name="peliculaId"><option value="">Ninguna</option><option th:each="p:${peliculas}" th:value="${p.id}" th:text="${p.titulo}"></option></select></label><label>Fecha<input type="date" name="fecha" th:value="${fecha}" required></label><label>Hora<input type="time" step="3600" name="hora" th:value="${hora}" required></label><label>Duración billar (horas)<input type="number" name="bloques" min="1" max="4" value="1"></label><label>Asistentes minicine<input type="number" name="asistentes" min="1" max="7"></label><button type="submit">Confirmar reserva</button></form></main><div th:replace="~{fragments/layout :: footer}"></div></body></html>
