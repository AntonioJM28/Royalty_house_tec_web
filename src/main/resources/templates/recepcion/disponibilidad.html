<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Disponibilidad | Royalty House</title><link rel="stylesheet" th:href="@{/css/royalty-house.css}"></head><body>
<div th:replace="~{fragments/layout :: header}"></div><main class="container"><h1>Grilla de disponibilidad</h1>
<form method="get" class="card form-stack"><label>Servicio<select name="servicio"><option value="">Seleccione</option><option value="billar" th:selected="${servicio=='billar'}">Billar</option><option value="minicine" th:selected="${servicio=='minicine'}">Minicine</option></select></label><label>Fecha<input type="date" name="fecha" th:value="${fecha}"></label><label>Tipo billar<select name="tipo"><option th:each="t:${tiposBillar}" th:value="${t}" th:text="${t}"></option></select></label><label>Película<select name="peliculaId"><option th:each="p:${peliculas}" th:value="${p.id}" th:text="${p.titulo}"></option></select></label><button type="submit">Consultar</button></form>
<section th:if="${disponibilidad}" class="table-wrap"><div th:each="r:${disponibilidad.recursos}" class="card"><h2 th:text="${r.recurso.nombre}"></h2><div class="slots"><span th:each="b:${r.bloques}" th:text="${b.inicio}" th:class="${b.inicioDisponible?'slot free':'slot busy'}"></span></div></div></section></main><div th:replace="~{fragments/layout :: footer}"></div></body></html>
