<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Películas | Royalty House</title><link rel="stylesheet" th:href="@{/css/royalty-house.css}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main class="container"><h1>Películas / cartelera</h1><form method="post" class="card form-stack"><input type="hidden" name="id"><label>Título<input name="titulo" required></label><label>Duración (minutos)<input type="number" name="duracion" min="1" required></label><label class="checkbox-label"><input type="checkbox" name="cartelera" value="true" checked> En cartelera</label><button>Guardar</button></form><table><tr><th>Título</th><th>Duración</th><th>Cartelera</th></tr><tr th:each="p:${peliculas}"><td th:text="${p.titulo}"></td><td th:text="${p.duracionMin}"></td><td th:text="${p.enCartelera}"></td></tr></table></main><div th:replace="~{fragments/layout :: footer}"></div></body></html>
