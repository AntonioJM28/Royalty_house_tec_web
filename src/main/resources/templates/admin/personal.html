<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Personal | Royalty House</title><link rel="stylesheet" th:href="@{/css/royalty-house.css}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main class="container"><h1>Lista blanca y roles</h1><div th:if="${error}" class="alert error" th:text="${error}"></div><form method="post" class="card form-stack"><label>Nombre<input name="nombre" required></label><label>Correo<input type="email" name="correo" required></label><label>Teléfono<input name="telefono"></label><label>Rol<select name="rol"><option value="RECEPCIONISTA">Recepcionista</option><option value="ADMINISTRADOR">Administrador</option></select></label><label>Contraseña<input type="password" name="contrasena" minlength="8"></label><label class="checkbox-label"><input type="checkbox" name="activo" value="true" checked> Activo</label><button>Agregar personal</button></form><table><tr><th>Correo</th><th>Rol</th><th>Activo</th></tr><tr th:each="u:${personal}"><td th:text="${u.correo}"></td><td th:text="${u.rol}"></td><td th:text="${u.activo}"></td></tr></table></main><div th:replace="~{fragments/layout :: footer}"></div></body></html>
