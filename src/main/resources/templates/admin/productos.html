<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Candy bar | Royalty House</title><link rel="stylesheet" th:href="@{/css/royalty-house.css}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main class="container"><h1>Catálogo y stock</h1><form method="post" class="card form-stack"><input type="hidden" name="id"><label>Nombre<input name="nombre" required></label><label>Precio<input type="number" name="precio" min="0" step="0.01" required></label><label>Stock<input type="number" name="stock" min="0" required></label><label class="checkbox-label"><input type="checkbox" name="activo" value="true" checked> Activo</label><button>Guardar</button></form><table><tr><th>Nombre</th><th>Precio</th><th>Stock</th><th>Activo</th></tr><tr th:each="p:${productos}"><td th:text="${p.nombre}"></td><td th:text="${p.precio}"></td><td th:text="${p.existencias}"></td><td th:text="${p.activo}"></td></tr></table></main><div th:replace="~{fragments/layout :: footer}"></div></body></html>
