<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Tarifas | Royalty House</title><link rel="stylesheet" th:href="@{/css/royalty-house.css}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main class="container"><h1>Tarifas</h1><form method="post" class="card form-stack"><label>Servicio<select name="tipo"><option value="MESA_NORMAL">Mesa normal (por hora)</option><option value="MESA_VIP">Mesa VIP (por hora)</option><option value="SALA_MINICINE">Minicine (por persona)</option></select></label><label>Precio<input type="number" name="precio" step="0.01" min="0" required></label><button>Guardar</button></form><table><tr><th>Tipo</th><th>Precio</th></tr><tr th:each="t:${tarifas}"><td th:text="${t.tipoRecurso}"></td><td th:text="${t.precioHora}"></td></tr></table></main><div th:replace="~{fragments/layout :: footer}"></div></body></html>
