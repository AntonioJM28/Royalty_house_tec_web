<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Mesas | Royalty House</title><link rel="stylesheet" th:href="@{/css/royalty-house.css}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main class="container"><h1>Mesas de billar</h1><form method="post" class="card form-stack"><input type="hidden" name="id"><label>Nombre<input name="nombre" required></label><label>Modalidad<select name="tipo"><option value="MESA_NORMAL">NORMAL</option><option value="MESA_VIP">VIP</option></select></label><label>Capacidad<input type="number" name="capacidad" min="1" value="4" required></label><label class="checkbox-label"><input type="checkbox" name="activo" value="true" checked> Activa</label><button>Guardar</button></form><table th:if="${recursos}"><tr><th>Nombre</th><th>Tipo</th><th>Capacidad</th><th>Activa</th></tr><tr th:each="r:${recursos}"><td th:text="${r.nombre}"></td><td th:text="${r.tipo}"></td><td th:text="${r.capacidad}"></td><td th:text="${r.activo}"></td></tr></table></main><div th:replace="~{fragments/layout :: footer}"></div></body></html>
