<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Reportes | Royalty House</title><link rel="stylesheet" th:href="@{/css/royalty-house.css}"></head><body><div th:replace="~{fragments/layout :: header}"></div><main class="container"><h1>Reportes de gestión</h1><form method="get" class="card form-stack"><label>Desde<input type="date" name="desde" th:value="${desde}"></label><label>Hasta<input type="date" name="hasta" th:value="${hasta}"></label><button>Generar</button></form><table><tr><th>Servicio</th><th>Ocupación</th><th>Ingresos estimados</th></tr><tr th:each="r:${reportes}"><td th:text="${r.servicio}"></td><td th:text="${r.ocupacionPorcentaje+' %'}"></td><td th:text="${r.ingresosEstimados}"></td></tr></table></main><div th:replace="~{fragments/layout :: footer}"></div></body></html>
