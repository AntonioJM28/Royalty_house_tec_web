<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Crear cuenta', ~{::main})}">
<main class="container narrow">
    <section class="card">
        <p class="eyebrow">Únete a Royalty House</p>
        <h1>Crear cuenta</h1>
        <div class="alert error" role="alert" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/registro}" th:object="${registroForm}" method="post" class="form-stack">
            <label for="nombre">Nombre completo</label>
            <input id="nombre" type="text" th:field="*{nombre}" maxlength="120" autocomplete="name" required>
            <small class="field-error" th:errors="*{nombre}"></small>

            <label for="correo">Correo electrónico</label>
            <input id="correo" type="email" th:field="*{correo}" maxlength="254" autocomplete="email" required>
            <small class="field-error" th:errors="*{correo}"></small>

            <label for="telefono">Teléfono</label>
            <input id="telefono" type="tel" th:field="*{telefono}" maxlength="30" autocomplete="tel" required>
            <small class="field-error" th:errors="*{telefono}"></small>

            <label for="contrasena">Contraseña (mínimo 8 caracteres)</label>
            <input id="contrasena" type="password" th:field="*{contrasena}" minlength="8"
                   autocomplete="new-password" required>
            <small class="field-error" th:errors="*{contrasena}"></small>

            <label class="checkbox-label">
                <input type="checkbox" th:field="*{aceptoDatos}" required>
                Acepto el tratamiento de mis datos personales para gestionar mis reservas.
            </label>
            <small class="field-error" th:errors="*{aceptoDatos}"></small>

            <button type="submit">Crear cuenta</button>
        </form>
        <p class="form-foot">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>.</p>
    </section>
</main>
</html>
